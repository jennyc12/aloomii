<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" role="img" aria-labelledby="title desc">
  <title id="title">The Table</title>
  <desc id="desc">The Table logo with a stylized table and six turquoise seat dots.</desc>
  <defs>
    <mask id="seat-dots" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#000"/>
      <g fill="#fff">
        <circle cx="13" cy="24" r="7"/>
        <circle cx="24" cy="24" r="6"/>
        <circle cx="35" cy="24" r="6"/>
        <circle cx="87" cy="24" r="7"/>
        <circle cx="76" cy="24" r="6"/>
        <circle cx="65" cy="24" r="6"/>
      </g>
      <g fill="#000">
        <circle cx="18.5" cy="24" r="1.25"/>
        <circle cx="29.5" cy="24" r="1.25"/>
        <circle cx="81.5" cy="24" r="1.25"/>
        <circle cx="70.5" cy="24" r="1.25"/>
      </g>
      <g fill="none" stroke="#000" stroke-width="1.5">
        <circle cx="13" cy="24" r="8.1"/>
        <circle cx="24" cy="24" r="7.1"/>
        <circle cx="87" cy="24" r="8.1"/>
        <circle cx="76" cy="24" r="7.1"/>
      </g>
    </mask>
  </defs>
  <g transform="translate(0 0)">
    <rect width="100" height="100" fill="#3DD9E5" mask="url(#seat-dots)"/>
    <rect x="7" y="44" width="86" height="10.5" rx="1.5" fill="#fff"/>
    <rect x="19" y="54.5" width="9.5" height="30" fill="#fff"/>
    <rect x="71.5" y="54.5" width="9.5" height="30" fill="#fff"/>
  </g>
  <g font-family="'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif" font-size="40" font-weight="800" letter-spacing=".5">
    <text x="112" y="84" fill="none" stroke="#fff" stroke-width="1.5" paint-order="stroke">THE</text>
    <text x="162" y="84" fill="#fff">TABLE</text>
  </g>
</svg>
